services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: flowcart-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_strong_pwd123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong_pwd123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - flowcart-network

  redis:
    image: redis:7-alpine
    container_name: flowcart-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - flowcart-network

  catalog-service:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.API/Dockerfile
    container_name: flowcart-catalog-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDb=Server=sqlserver,1433;Database=CatalogDb;User Id=sa;Password=Your_strong_pwd123!;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flowcart-network

  inventory-service:
    build:
      context: .
      dockerfile: src/Services/Inventory/Inventory.API/Dockerfile
    container_name: flowcart-inventory-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__InventoryDb=Server=sqlserver,1433;Database=InventoryDb;User Id=sa;Password=Your_strong_pwd123!;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - flowcart-network

  ordering-service:
    build:
      context: .
      dockerfile: src/Services/Ordering/Ordering.API/Dockerfile
    container_name: flowcart-ordering-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrderingDb=Server=sqlserver,1433;Database=OrderingDb;User Id=sa;Password=Your_strong_pwd123!;TrustServerCertificate=True;
      - Services__CatalogUrl=http://catalog-service:8080/
      - Services__InventoryUrl=http://inventory-service:8080/
    depends_on:
      sqlserver:
        condition: service_healthy
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - flowcart-network

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/ApiGateway.API/Dockerfile
    container_name: flowcart-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5000:8080"
    depends_on:
      catalog-service:
        condition: service_started
      ordering-service:
        condition: service_started
      inventory-service:
        condition: service_started
    networks:
      - flowcart-network

networks:
  flowcart-network:
    driver: bridge

volumes:
  sqlserver_data:
  redis_data:
